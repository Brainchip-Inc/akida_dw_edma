PACKAGE_NAME="akida-pcie"
PACKAGE_VERSION="1.0"

# KERNEL_VERSION is ?= in the Makefile, so this correctly targets the kernel
# DKMS is building for even when it is not the running kernel (e.g. right
# after a kernel package upgrade, before reboot).
#
# CFG_AKIDA_DMA_RAM_PHY_FILE is passed through for users who need a non-default
# DMA RAM PHY layout (see cfg_dma_ram_phy_*.mk). It expands from the DKMS
# process environment, so it is only honored on a manual `dkms build`/`install`
# run with the variable exported (e.g. `sudo -E env CFG_AKIDA_DMA_RAM_PHY_FILE=
# cfg_dma_ram_phy_4MB.mk dkms install -m akida-pcie -v 1.0 --force`). It is left
# unset (and therefore has no effect) on the automatic rebuild that AUTOINSTALL
# triggers from a kernel postinst hook — see README for details.
MAKE="'make' KERNEL_VERSION=${kernelver} CFG_AKIDA_DMA_RAM_PHY_FILE=${CFG_AKIDA_DMA_RAM_PHY_FILE:-} all"
CLEAN="'make' clean"
BUILT_MODULE_NAME[0]="akida-pcie"
DEST_MODULE_LOCATION[0]="/updates"
AUTOINSTALL="yes"
POST_INSTALL="post_install.sh"

# The kbuild half of the Makefile only supports kernel 5.4 through 6.8
# (anything outside that range hits a Makefile $(error)). Restrict DKMS to
# that range so an unsupported kernel is skipped cleanly - reported as "not
# applicable" - instead of AUTOINSTALL failing loudly on every future kernel
# upgrade. This does not add support for 6.9+; that is tracked in issue #23.
BUILD_EXCLUSIVE_KERNEL="^(5\.(4|5|6|7|8|9|1[0-9])\.|6\.[0-8]\.)"
